<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Queixa Principal</title>
<!-- O GitHub Pages serve esta página para endereços que não existem. qprincipal.com.br/<nome> é um link pessoal:
     manda para /?u=<nome> (o index.html devolve o endereço para /<nome>). Qualquer outra coisa volta para o início. -->
<script>(function(){var l=location,p=l.pathname.replace(/^\/+|\/+$/g,"");
if(/^[a-z0-9][a-z0-9-]{0,29}$/i.test(p))l.replace("/?u="+encodeURIComponent(p.toLowerCase())+l.hash);else l.replace("/")})();</script>
</head>
<body><p><a href="/">Queixa Principal</a></p></body>
</html>
