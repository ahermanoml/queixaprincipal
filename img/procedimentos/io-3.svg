<svg xmlns="http://www.w3.org/2000/svg" class="qpf-io-3" viewBox="0 0 560 440" role="img" aria-labelledby="io-3-t io-3-d">
<title id="io-3-t">A agulha tem o tamanho certo?</title>
<desc id="io-3-d">Dois cortes esquemáticos. A agulha atravessa a pele e o subcutâneo e encosta no osso antes de perfurar. À esquerda, ainda sobra uma marca preta visível acima da pele: o comprimento serve. À direita, com tecido mais espesso, nenhuma marca aparece: a agulha é curta, trocar pela maior.</desc>
<style>
.qpf-io-3 text{font-family:system-ui,"Segoe UI",Roboto,sans-serif;font-size:20px;fill:#1f2a33;paint-order:stroke;stroke:#f7f8fa;stroke-width:4px;stroke-linejoin:round}
.qpf-io-3 .b{font-weight:700}
.qpf-io-3 .a{fill:#0b63c9}
.qpf-io-3 .r{fill:#c62828}
.qpf-io-3 .s{font-size:18px}
.qpf-io-3 .ln{stroke:#1f2a33;stroke-width:2}
</style>
<defs>
<!-- agulha: canhão + haste com marcas pretas a cada 5 mm perto do canhão -->
<g id="io-3-ag">
<rect x="-22" y="0" width="44" height="34" rx="6" fill="#0b63c9"/>
<rect x="-5" y="34" width="10" height="150" fill="#cfd6de" stroke="#1f2a33" stroke-width="1.5"/>
<rect x="-5" y="44" width="10" height="8" fill="#1f2a33"/>
<rect x="-5" y="64" width="10" height="8" fill="#1f2a33"/>
<path d="M-5 184 L5 184 L0 196 Z" fill="#cfd6de" stroke="#1f2a33" stroke-width="1.5" stroke-linejoin="round"/>
</g>
</defs>
<rect width="560" height="440" rx="18" fill="#f7f8fa"/>

<!-- painel 1: serve -->
<g transform="translate(20 80)">
<rect x="0" y="120" width="250" height="56" fill="#ecd9cc"/>
<line x1="0" y1="120" x2="250" y2="120" class="ln"/>
<rect x="0" y="176" width="250" height="84" fill="#fff" class="ln"/>
<path d="M0 196 H250" stroke="#1f2a33" stroke-width="1.5" stroke-dasharray="3 5"/>
<use href="#io-3-ag" x="125" y="-20"/>
<!-- destaque da marca visível -->
<rect x="104" y="40" width="42" height="20" rx="4" fill="none" stroke="#0b63c9" stroke-width="3"/>
</g>
<text x="20" y="34" class="b a">✓ Sobra 1 marca</text>
<text x="20" y="56" class="s">comprimento serve</text>

<!-- painel 2: curta -->
<g transform="translate(290 80)">
<use href="#io-3-ag" x="125" y="-20"/>
<rect x="0" y="16" width="250" height="160" fill="#ecd9cc"/>
<line x1="0" y1="16" x2="250" y2="16" class="ln"/>
<rect x="120" y="16" width="10" height="160" fill="none" stroke="#1f2a33" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="0" y="176" width="250" height="84" fill="#fff" class="ln"/>
<path d="M0 196 H250" stroke="#1f2a33" stroke-width="1.5" stroke-dasharray="3 5"/>
<g stroke="#c62828" stroke-width="4" stroke-linecap="round"><line x1="168" y1="-14" x2="188" y2="6"/><line x1="188" y1="-14" x2="168" y2="6"/></g>
</g>
<text x="290" y="34" class="b r">✗ Nenhuma marca</text>
<text x="290" y="56" class="s">curta: trocar pela maior</text>

<!-- rótulos inferiores -->
<text x="48" y="388" class="s">Pele e subcutâneo</text>
<text x="48" y="412" class="s">Osso (córtex): a ponta encosta</text>
<rect x="20" y="374" width="18" height="18" fill="#ecd9cc" class="ln"/>
<rect x="20" y="398" width="18" height="18" fill="#fff" class="ln"/>
</svg>
