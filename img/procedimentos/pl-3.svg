<svg xmlns="http://www.w3.org/2000/svg" class="qpf-pl-3" viewBox="0 0 560 420" role="img" aria-labelledby="pl-3-t pl-3-d">
<title id="pl-3-t">O que a agulha atravessa</title>
<desc id="pl-3-d">Corte sagital esquemático da coluna lombar, cabeça à esquerda. A agulha entra na linha média entre dois processos espinhosos, levemente inclinada para a cabeça, e atravessa pele, subcutâneo, ligamento supraespinhoso, ligamento interespinhoso, ligamento amarelo (a resistência que cede), espaço epidural e dura-máter com a aracnoide, chegando ao espaço subaracnoide com o líquor e as raízes da cauda equina.</desc>
<style>
.qpf-pl-3 text{font-family:system-ui,"Segoe UI",Roboto,sans-serif;font-size:20px;fill:#1f2a33;paint-order:stroke;stroke:#f7f8fa;stroke-width:4px;stroke-linejoin:round}
.qpf-pl-3 .b{font-weight:700}
.qpf-pl-3 .a{fill:#0b63c9}
.qpf-pl-3 .s{font-size:17px}
.qpf-pl-3 .ln{stroke:#1f2a33;stroke-width:2}
</style>
<rect width="560" height="420" rx="18" fill="#f7f8fa"/>
<clipPath id="pl-3-c"><rect x="16" y="20" width="390" height="390" rx="12"/></clipPath>
<g clip-path="url(#pl-3-c)">
<!-- pele e subcutâneo -->
<rect x="0" y="40" width="420" height="44" fill="#f1e4da"/>
<line x1="0" y1="40" x2="420" y2="40" class="ln"/>
<!-- ligamento interespinhoso (entre os processos) -->
<rect x="0" y="84" width="420" height="140" fill="#eadfc8"/>
<!-- processos espinhosos e lâminas -->
<path d="M40 92 H214 Q222 92 222 104 V226 H40 Z" fill="#fff" class="ln"/>
<path d="M300 104 Q300 92 310 92 H430 V226 H300 Z" fill="#fff" class="ln"/>
<!-- ligamento supraespinhoso -->
<rect x="0" y="84" width="420" height="8" fill="#d9c79e"/>
<line x1="0" y1="84" x2="420" y2="84" stroke="#1f2a33" stroke-width="1.5"/>
<!-- ligamento amarelo -->
<rect x="222" y="226" width="78" height="30" fill="#e8c54a" class="ln"/>
<rect x="0" y="226" width="222" height="30" fill="#fff" class="ln"/>
<rect x="300" y="226" width="130" height="30" fill="#fff" class="ln"/>
<!-- espaço epidural -->
<rect x="0" y="256" width="420" height="20" fill="#f4eccb"/>
<!-- dura + aracnoide e espaço subaracnoide -->
<rect x="0" y="276" width="420" height="78" fill="#dbe9f6"/>
<line x1="0" y1="276" x2="420" y2="276" stroke="#1f2a33" stroke-width="3.5"/>
<line x1="0" y1="354" x2="420" y2="354" stroke="#1f2a33" stroke-width="3.5"/>
<g stroke="#5b6b7d" stroke-width="2.5" stroke-linecap="round">
<line x1="20" y1="300" x2="400" y2="302"/><line x1="20" y1="318" x2="400" y2="322"/><line x1="20" y1="336" x2="400" y2="338"/>
</g>
<!-- corpos vertebrais -->
<rect x="0" y="360" width="420" height="60" fill="#fff" class="ln"/>
<!-- agulha: linha média, levemente cefálica -->
<path d="M268 26 L253 300" stroke="#0b63c9" stroke-width="6" stroke-linecap="round"/>
</g>
<rect x="16" y="20" width="390" height="390" rx="12" fill="none" class="ln"/>
<rect x="254" y="2" width="30" height="26" rx="4" fill="#0b63c9"/>
<path d="M268 26 L266 40" stroke="#0b63c9" stroke-width="6"/>
<!-- rótulos -->
<text x="416" y="66" class="s">Pele</text>
<line x1="414" y1="60" x2="400" y2="60" class="ln"/>
<text x="416" y="98" class="s">Supraespinhoso</text>
<line x1="414" y1="92" x2="400" y2="88" class="ln"/>
<text x="416" y="150" class="s">Interespinhoso</text>
<line x1="414" y1="144" x2="290" y2="150" class="ln"/>
<text x="416" y="236" class="b s">Lig. amarelo</text>
<text x="416" y="256" class="s">resistência cede</text>
<line x1="414" y1="232" x2="296" y2="240" class="ln"/>
<text x="416" y="282" class="s">Epidural</text>
<line x1="414" y1="276" x2="400" y2="268" class="ln"/>
<text x="416" y="306" class="b s">Dura-máter</text>
<line x1="414" y1="300" x2="400" y2="278" class="ln"/>
<text x="416" y="334" class="b a s">LCR</text>
<text x="416" y="354" class="s">+ raízes</text>
<text x="416" y="396" class="s">← cabeça</text>
<text x="60" y="166" class="s">processo</text>
<text x="60" y="186" class="s">espinhoso</text>
</svg>
