<title id="dreno-8-t">Fixação e raio-x de controle</title>
<desc id="dreno-8-d">À esquerda, o dreno saindo da pele fixado com sutura e coberto por curativo. À direita, raio-x de tórax de controle com o dreno no hemitórax direito, ponta voltada para o ápice e pulmão reexpandido.</desc>
