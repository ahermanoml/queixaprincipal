<svg xmlns="http://www.w3.org/2000/svg" class="qpf-cardioversao-1" viewBox="0 0 560 420" role="img" aria-labelledby="cardioversao-1-t cardioversao-1-d">
<title id="cardioversao-1-t">Posição das pás</title>
<desc id="cardioversao-1-d">Três troncos. Anterolateral, de frente: uma pá abaixo da clavícula direita, ao lado do esterno, e outra no ápice, à esquerda, na linha axilar média abaixo da axila. Anteroposterior: uma pá na frente, sobre o precórdio à esquerda do esterno, e outra nas costas, entre a escápula esquerda e a coluna.</desc>
<style>
.qpf-cardioversao-1 text{font-family:system-ui,"Segoe UI",Roboto,sans-serif;font-size:20px;fill:#1f2a33;paint-order:stroke;stroke:#f7f8fa;stroke-width:4px;stroke-linejoin:round}
.qpf-cardioversao-1 .b{font-weight:700}
.qpf-cardioversao-1 .a{fill:#0b63c9}
.qpf-cardioversao-1 .s{font-size:17px}
.qpf-cardioversao-1 .ln{stroke:#1f2a33;stroke-width:2}
</style>
<rect width="560" height="420" rx="18" fill="#f7f8fa"/>
