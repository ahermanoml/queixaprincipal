<svg xmlns="http://www.w3.org/2000/svg" class="qpf-descompressao-1" viewBox="0 0 560 420" role="img" aria-labelledby="descompressao-1-t descompressao-1-d">
<title id="descompressao-1-t">Locais da descompressão</title>
<desc id="descompressao-1-d">Tórax visto de frente, com as costelas. Ponto 1, adulto (padrão): 4º a 5º espaço intercostal, logo anterior à linha axilar média. Ponto 2, criança ou alternativa no adulto: 2º espaço intercostal na linha hemiclavicular; o ângulo de Louis marca a 2ª costela; não medializar a partir da linha hemiclavicular.</desc>
<style>
.qpf-descompressao-1 text{font-family:system-ui,"Segoe UI",Roboto,sans-serif;font-size:20px;fill:#1f2a33;paint-order:stroke;stroke:#f7f8fa;stroke-width:4px;stroke-linejoin:round}
.qpf-descompressao-1 .b{font-weight:700}
.qpf-descompressao-1 .a{fill:#0b63c9}
.qpf-descompressao-1 .r{fill:#c62828}
.qpf-descompressao-1 .s{font-size:18px}
.qpf-descompressao-1 .ln{stroke:#1f2a33;stroke-width:2}
</style>
<rect width="560" height="420" rx="18" fill="#f7f8fa"/>
<!-- tronco -->
<path d="M246 0 V60 Q240 76 200 82 Q130 90 108 120 Q96 200 104 300 Q108 360 120 420 H440 Q452 360 456 300 Q464 200 452 120 Q430 90 360 82 Q320 76 314 60 V0 Z" fill="#ecd9cc" class="ln"/>
