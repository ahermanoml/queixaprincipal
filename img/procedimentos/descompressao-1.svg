<text x="400" y="30" class="b a">② 2º EIC,</text>
<text x="400" y="52" class="b a">hemiclavicular</text>
<line x1="420" y1="58" x2="352" y2="127" stroke="#0b63c9" stroke-width="2"/>
<text x="16" y="30" class="s">criança; ou adulto</text>
<text x="16" y="50" class="s">sem acesso lateral</text>
<text x="16" y="74" class="b r s">não medializar</text>
<line x1="150" y1="68" x2="304" y2="132" stroke="#c62828" stroke-width="2"/>
<text x="16" y="200" class="b s">Ângulo de Louis</text>
<text x="16" y="222" class="s">= 2ª costela</text>
<line x1="150" y1="194" x2="264" y2="130" class="ln"/>
<text x="300" y="336" class="b a">① 4º–5º EIC</text>
<text x="300" y="358" class="b a">logo anterior à LAM</text>
