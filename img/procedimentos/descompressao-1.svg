65 180 Q180 174 108 152" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path d="M265 206 Q180 200 108 178" fill="none" stroke="#1f2a33" stroke-width="12" stroke-linecap="round"/><path d="M265 206 Q180 200 108 178" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path d="M265 232 Q180 226 108 204" fill="none" stroke="#1f2a33" stroke-width="12" stroke-linecap="round"/><path d="M265 232 Q180 226 108 204" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
