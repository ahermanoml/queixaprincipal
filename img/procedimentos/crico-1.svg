<svg xmlns="http://www.w3.org/2000/svg" class="qpf-crico-1" viewBox="0 0 560 420" role="img" aria-labelledby="crico-1-t crico-1-d">
<title id="crico-1-t">Membrana cricotireóidea</title>
<desc id="crico-1-d">Vista anterior do pescoço com as cartilagens. A membrana cricotireóidea fica entre a borda inferior da cartilagem tireoide e o anel da cricoide. A mão não dominante fixa a laringe pelas lâminas da tireoide. A incisão é transversa, pela pele e pela membrana. Se a membrana não for palpável, incisão vertical de 8 a 10 cm na linha média.</desc>
<style>
.qpf-crico-1 text{font-family:system-ui,"Segoe UI",Roboto,sans-serif;font-size:20px;fill:#1f2a33;paint-order:stroke;stroke:#f7f8fa;stroke-width:4px;stroke-linejoin:round}
.qpf-crico-1 .b{font-weight:700}
.qpf-crico-1 .a{fill:#0b63c9}
.qpf-crico-1 .r{fill:#c62828}
.qpf-crico-1 .s{font-size:18px}
.qpf-crico-1 .ln{stroke:#1f2a33;stroke-width:2}
</style>
<rect width="560" height="420" rx="18" fill="#f7f8fa"/>
<!-- pescoço -->
<path d="M170 0 V330 Q170 372 110 392 L60 420 H500 L450 392 Q390 372 390 330 V0 Z" fill="#ecd9cc" class="ln"/>
<!-- hioide -->
<path d="M226 64 Q280 56 334 64 L334 74 Q280 66 226 74 Z" fill="#fff" class="ln"/>
<!-- cartilagem tireoide -->
<path d="M214 104 L268 104 L280 124 L292 104 L346 104 L338 168 Q320 198 280 204 Q240 198 222 168 Z" fill="#fff" class="ln" stroke-linejoin="round"/>
<!-- membrana cricotireóidea -->
<path d="M250 199 Q280 210 310 199 L307 234 Q280 240 253 234 Z" fill="#0b63c9" fill-opacity=".18" stroke="#0b63c9" stroke-width="3" stroke-linejoin="round"/>
<!-- cricoide -->
<path d="M230 238 Q280 230 330 238 L332 262 Q280 272 228 262 Z" fill="#fff" class="ln"/>
<!-- traqueia -->
<g fill="#fff" stroke="#1f2a33" stroke-width="2">
<rect x="238" y="276" width="84" height="14" rx="7"/>
<rect x="238" y="298" width="84" height="14" rx="7"/>
<rect x="238" y="320" width="84" height="14" rx="7"/>
<rect x="238" y="342" width="84" height="14" rx="7"/>
</g>
<!-- incisão vertical se não palpável -->
<line x1="280" y1="132" x2="280" y2="372" stroke="#1f2a33" stroke-width="2" stroke-dasharray="3 6" stroke-linecap="round"/>
<!-- incisão transversa -->
<line x1="258" y1="218" x2="302" y2="218" stroke="#0b63c9" stroke-width="6" stroke-linecap="round"/>
<!-- dedos fixando a laringe (polegar e médio) -->
<ellipse cx="204" cy="146" rx="18" ry="26" fill="#dfc3b4" class="ln"/>
<ellipse cx="356" cy="146" rx="18" ry="26" fill="#dfc3b4" class="ln"/>
<!-- rótulos -->
<text x="16" y="120" class="b s">Cartilagem</text>
<text x="16" y="140" class="b s">tireoide</text>
<line x1="104" y1="134" x2="226" y2="160" class="ln"/>
<text x="16" y="216" class="b a">Membrana</text>
<text x="16" y="238" class="b a">cricotireóidea</text>
<line x1="150" y1="226" x2="252" y2="222" stroke="#0b63c9" stroke-width="2"/>
<text x="16" y="282" class="b s">Cricoide</text>
<line x1="96" y1="276" x2="230" y2="252" class="ln"/>
<text x="16" y="342" class="s">Traqueia</text>
<line x1="98" y1="336" x2="238" y2="326" class="ln"/>
<text x="398" y="200" class="b a s">Incisão</text>
<text x="398" y="220" class="b a s">transversa</text>
<line x1="396" y1="212" x2="306" y2="218" stroke="#0b63c9" stroke-width="2"/>
<text x="398" y="104" class="s">dedos fixam</text>
<text x="398" y="124" class="s">a laringe</text>
<line x1="410" y1="132" x2="374" y2="146" class="ln"/>
<text x="398" y="300" class="s">não palpável:</text>
<text x="398" y="320" class="s">vertical,</text>
<text x="398" y="340" class="s">8–10 cm</text>
<line x1="396" y1="316" x2="286" y2="316" class="ln"/>
</svg>
