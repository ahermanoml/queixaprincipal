<svg xmlns="http://www.w3.org/2000/svg" class="qpf-dreno-3" viewBox="0 0 560 440" width="560" height="440" role="img" aria-labelledby="dreno-3-t dreno-3-d">
<title id="dreno-3-t">Selo d'água</title>
<desc id="dreno-3-d">Paciente na maca com o dreno ligado por uma extensão a um frasco no chão, bem abaixo do nível do tórax. No frasco, a haste ligada ao paciente fica cerca de 2 cm abaixo da água e um respiro curto fica aberto para o ar. A coluna de água na haste oscila com a respiração e borbulha quando sai ar da pleura.</desc>
