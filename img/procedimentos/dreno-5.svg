<svg xmlns="http://www.w3.org/2000/svg" class="qpf-dreno-5" viewBox="0 0 560 440" width="560" height="440" role="img" aria-labelledby="dreno-5-t dreno-5-d">
<title id="dreno-5-t">Anestesia por planos e incisão</title>
<desc id="dreno-5-d">À esquerda, corte da parede com a agulha de anestesia entrando sobre a costela de baixo: anestesiar pele, trajeto, periósteo da borda superior da costela e pleura. À direita, a pele vista de fora com as duas costelas por baixo: a incisão de 2 a 3 cm é feita sobre a costela de baixo, paralela a ela, abaixo do espaço escolhido.</desc>
