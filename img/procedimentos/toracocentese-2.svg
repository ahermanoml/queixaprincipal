<svg xmlns="http://www.w3.org/2000/svg" class="qpf-toracocentese-2" viewBox="0 0 560 420" role="img" aria-labelledby="tc-2-t tc-2-d">
<title id="tc-2-t">Agulha rente à borda superior da costela de baixo</title>
<desc id="tc-2-d">Corte da parede torácica com duas costelas. O feixe vásculo-nervoso (veia, artéria, nervo) corre na goteira sob a borda inferior da costela de cima. A agulha entra logo acima da costela de baixo e chega ao líquido pleural.</desc>
<style>
.qpf-toracocentese-2 text{font-family:system-ui,"Segoe UI",Roboto,sans-serif;font-size:20px;fill:#1f2a33;paint-order:stroke;stroke:#f7f8fa;stroke-width:4px;stroke-linejoin:round}
.qpf-toracocentese-2 .b{font-weight:700}
.qpf-toracocentese-2 .r{fill:#c62828}
.qpf-toracocentese-2 .a{fill:#0b63c9}
.qpf-toracocentese-2 .ln{stroke:#1f2a33;stroke-width:2}
</style>
<rect width="560" height="420" rx="18" fill="#f7f8fa"/>
<!-- camadas: pele/subcutâneo | parede (costelas + intercostais) | líquido | pulmão -->
<rect x="60" y="16" width="52" height="388" fill="#f1e4da"/>
<rect x="112" y="16" width="146" height="388" fill="#ead7d0"/>
<rect x="258" y="16" width="196" height="388" fill="#f4eccb"/>
<path d="M454 16 H544 V404 H454 Q440 210 454 16 Z" fill="#f1dcdc"/>
<line x1="60" y1="16" x2="60" y2="404" class="ln"/>
<line x1="258" y1="16" x2="258" y2="404" class="ln"/>
<path d="M454 16 Q440 210 454 404" class="ln" fill="none"/>
<!-- costela de cima: goteira na face interna-inferior -->
<path d="M150 32 Q150 22 160 22 H232 Q242 22 242 32 V98 Q232 98 222 104 Q212 112 210 128 H160 Q150 128 150 118 Z" fill="#fff" class="ln"/>
<!-- costela de baixo -->
<path d="M150 266 Q150 256 160 256 H232 Q242 256 242 266 V332 Q232 332 222 338 Q212 346 210 362 H160 Q150 362 150 352 Z" fill="#fff" class="ln"/>
<text x="164" y="70" style="font-size:17px">costela</text>
<text x="164" y="90" style="font-size:17px">de cima</text>
<text x="164" y="304" style="font-size:17px">costela</text>
<text x="164" y="324" style="font-size:17px">de baixo</text>
<!-- feixe VAN da costela de cima -->
<g stroke="#c62828" stroke-width="2">
<circle cx="226" cy="112" r="8" fill="#fbd5d5"/>
<circle cx="226" cy="130" r="8" fill="#e57373"/>
<circle cx="226" cy="148" r="8" fill="#fff"/>
</g>
<!-- feixe da costela de baixo (mais claro) -->
<g stroke="#c62828" stroke-width="2" opacity=".5">
<circle cx="226" cy="346" r="7" fill="#fbd5d5"/>
<circle cx="226" cy="362" r="7" fill="#e57373"/>
<circle cx="226" cy="378" r="7" fill="#fff"/>
</g>
<!-- trajeto errado -->
<line x1="16" y1="160" x2="214" y2="160" stroke="#c62828" stroke-width="2" stroke-dasharray="8 6"/>
<g stroke="#c62828" stroke-width="4" stroke-linecap="round">
<line x1="74" y1="148" x2="98" y2="172"/><line x1="98" y1="148" x2="74" y2="172"/>
</g>
<text x="16" y="200" class="b r">Não aqui</text>
<!-- agulha certa -->
<rect x="12" y="236" width="40" height="18" rx="3" fill="#0b63c9"/>
<path d="M52 242 H330 L350 245 L330 248 H52 Z" fill="#0b63c9" stroke="#0b63c9" stroke-width="2" stroke-linejoin="round"/>
<!-- rótulos -->
<text x="272" y="56" class="b r">Feixe vásculo-</text>
<text x="272" y="80" class="b r">-nervoso (V-A-N)</text>
<line x1="272" y1="90" x2="236" y2="124" stroke="#c62828" stroke-width="2"/>
<text x="272" y="186" class="b a">Agulha rente à</text>
<text x="272" y="210" class="b a">borda superior da</text>
<text x="272" y="234" class="b a">costela de baixo</text>
<text x="300" y="320">Líquido</text>
<text x="463" y="200">Pulmão</text>
<text x="66" y="300" style="font-size:17px">Pele</text>
</svg>
