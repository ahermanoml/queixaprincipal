<svg xmlns="http://www.w3.org/2000/svg" class="qpf-dreno-7" viewBox="0 0 560 440" width="560" height="440" role="img" aria-labelledby="dreno-7-t dreno-7-d">
<title id="dreno-7-t">Direção do dreno</title>
<desc id="dreno-7-d">Tórax visto de frente, com o dreno entrando pela lateral direita no 4º ou 5º espaço intercostal. Para ar, o dreno vai para cima e para a frente, rumo ao ápice; para líquido, para trás e para baixo, rumo à base. No detalhe, todos os orifícios do dreno ficam dentro do tórax.</desc>
<style>.qpf-dreno-7 text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.qpf-dreno-7 .t{paint-order:stroke;stroke:#f6f1e6;stroke-width:5px;stroke-linejoin:round}.qpf-dreno-7 .nh{stroke:none}</style>
