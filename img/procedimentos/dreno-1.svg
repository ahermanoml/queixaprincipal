<svg xmlns="http://www.w3.org/2000/svg" class="qpf-dreno-1" viewBox="0 0 560 440" width="560" height="440" role="img" aria-labelledby="dreno-1-t dreno-1-d">
<title id="dreno-1-t">Triângulo de segurança</title>
<desc id="dreno-1-d">Tórax visto pelo lado direito, braço levantado com a mão atrás da cabeça. O triângulo de segurança fica entre a borda lateral do peitoral maior, a borda anterior do grande dorsal e a linha horizontal do mamilo, que marca o 5º espaço intercostal, com o ápice abaixo da axila. A inserção é no 4º ou 5º espaço intercostal, logo à frente da linha axilar média. Abaixo da linha do mamilo ficam o diafragma, o fígado e o baço: não entrar.</desc>
<style>.qpf-dreno-1 text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.qpf-dreno-1 .t{paint-order:stroke;stroke:#f6f1e6;stroke-width:5px;stroke-linejoin:round}.qpf-dreno-1 .nh{stroke:none}</style>
