<svg xmlns="http://www.w3.org/2000/svg" class="qpf-dreno-9" viewBox="0 0 560 440" width="560" height="440" role="img" aria-labelledby="dreno-9-t dreno-9-d">
<title id="dreno-9-t">Atenção: borbulha e sangramento</title>
<desc id="dreno-9-d">Dois avisos. À esquerda, uma pinça clampeando um dreno que borbulha, riscada: dreno que borbulha não se clampeia. À direita, um frasco com sangue na marca de 1.500 mL e um relógio: hemotórax com 1.500 mL na drenagem inicial, ou mais de 200 mL por hora durante 2 a 4 horas, é indicação de cirurgia.</desc>
<style>.qpf-dreno-9 text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.qpf-dreno-9 .t{paint-order:stroke;stroke:#f6f1e6;stroke-width:5px;stroke-linejoin:round}.qpf-dreno-9 .nh{stroke:none}</style>
