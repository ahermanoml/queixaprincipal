<svg xmlns="http://www.w3.org/2000/svg" class="qpf-dreno-6" viewBox="0 0 560 440" width="560" height="440" role="img" aria-labelledby="dreno-6-t dreno-6-d">
<title id="dreno-6-t">Pleura aberta e dedo no trajeto</title>
<desc id="dreno-6-d">Corte da parede: a pleura é perfurada com a pinça Kelly fechada, que depois se abre para alargar. Em seguida o dedo entra pelo trajeto, por cima da costela de baixo, e confere que está na cavidade pleural, soltando aderências. Trocarte para introduzir o dreno: nunca.</desc>
