<svg xmlns="http://www.w3.org/2000/svg" class="qpf-dreno-2" viewBox="0 0 560 440" width="560" height="440" role="img" aria-labelledby="dreno-2-t dreno-2-d">
<title id="dreno-2-t">Corte da parede: por cima da costela de baixo</title>
<desc id="dreno-2-d">Corte da parede do tórax entre duas costelas, de fora (em cima) para dentro (embaixo): pele, subcutâneo, músculo, costelas com os músculos intercostais, pleura parietal e pulmão. O feixe vasculonervoso (veia, artéria e nervo) corre na borda inferior da costela de cima. A pinça Kelly faz a dissecção romba por cima da borda superior da costela de baixo, longe do feixe.</desc>
<style>.qpf-dreno-2 text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.qpf-dreno-2 .t{paint-order:stroke;stroke:#f6f1e6;stroke-width:5px;stroke-linejoin:round}.qpf-dreno-2 .nh{stroke:none}</style>
